name: CI

on:
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    name: Pre commit checks, sercrets + dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

#Terraform checks, using matrix to check each environment seperately.
  terraform:
    name: Terraform checks (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    defaults:
      run:
        working-directory: terraform/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend, syntax check only)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/${{ matrix.environment }}
          framework: terraform
